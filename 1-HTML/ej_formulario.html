<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
<form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre">
    <br><br>
    Apellido:
    <input type="text" id="apellido" name="apellido">
    <br><br>
    <label for="sexo">Sexo:</label>
    <input type="radio" id="masculino" name="sexo" value="masculino">
    <label for="masculino">Masculino</label>
    <input type="radio" id="femenino" name="sexo" value="femenino">
    <label for="femenino">Femenino</label>
    <br><br>
    Edad:
    <input type="number" id="edad" name="edad">
    <br><br>
    Email:
    <input type="email" id="email" name="email">
    <br><br>
    Usuario:
    <input type="text" id="usuario" name="usuario">
    <br><br>
    Password:
    <input type="password" id="password" name="password">
    <br><br>
    Confirmar Password:
    <input type="password" id="confirmar_password" name="confirmar_password">
    <br><br>

    <label for="servicio"></label>Tipo de servicio:</label>
    <br><br>
    <input type="radio" id="free" name="servicio" value="free">
    <label for="free">Free</label>
    <br>
    <input type="radio" id="standard" name="servicio" value="standard">
    <label for="standard">Standard</label>
    <br>
    <input type="radio" id="premium" name="servicio" value="premium">
    <label for="premium">Premium</label>
    <br><br>


    <label for="tema">Tema:</label>
    <select id="tema" name="tema">
        <option value="politica">Política</option>
        <option value="negocios">Negocios</option>
        <option value="tecnologia">Tecnología</option>
        <option value="salud">Salud</option>
    </select>
    <br><br>
    <label for="comentario">Agregue un comentario:</label>
    <br><br>
    <textarea id="comentario" name="comentario"></textarea>
    <br><br>
    <input type="submit" value="Enviar">
</form>


</body>
</html>
